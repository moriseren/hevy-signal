name: Recover editable v3.5 Mac source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-v35-source.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recover published tested desktop sources into repository
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/hevy-source.zip \
            "https://github.com/moriseren/hevy-signal/releases/download/v3.5/Hevy-Signal-v3.5-source.zip"
          mkdir -p /tmp/hevy-v35
          unzip -q /tmp/hevy-source.zip -d /tmp/hevy-v35
          find /tmp/hevy-v35 -maxdepth 3 -name main.go -print
          SRC=/tmp/hevy-v35/Hevy-Signal-v3.2-source
          test -f "$SRC/main.go"
          mkdir -p desktop
          cp -a "$SRC/." desktop/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop
          git commit -m "Track editable tested v3.5 Mac source in repository"
          git push
