name: Inspect desktop source archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-desktop.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download released source
        shell: bash
        run: |
          curl -fLsS --retry 3 -o /tmp/source.zip "https://github.com/moriseren/hevy-signal/releases/download/v3.2/Hevy-Signal-v3.2-source.zip"
          unzip -l /tmp/source.zip | head -65
          mkdir -p /tmp/hevy-src
          unzip -q /tmp/source.zip -d /tmp/hevy-src
          echo '=== SOURCE FILES ==='
          find /tmp/hevy-src -maxdepth 4 -type f | head -90
          echo '=== GO MODULES / BUILD / MUSCLE CODE ==='
          find /tmp/hevy-src -type f \( -name "*.go" -o -name "go.mod" -o -name "*.sh" \) | head -60
          python3 "$GITHUB_WORKSPACE/scripts/patch-desktop-v33.py" /tmp/hevy-src/Hevy-Signal-v3.2-source
          cd /tmp/hevy-src/Hevy-Signal-v3.2-source
          echo '=== MAIN 95-205 ==='; sed -n '95,205p' main.go
          echo '=== MAIN 710-825 ==='; sed -n '710,825p' main.go
          echo '=== MAIN 1350-1480 ==='; sed -n '1350,1480p' main.go
          echo '=== MAIN 1550-1720 ==='; sed -n '1550,1720p' main.go
          echo '=== LAUNCHER ==='; head -100 cmd/macos-launcher/main.go
          echo '=== FRONTEND BINDINGS ==='; grep -nE 'unmapped|major_muscles|supporting_muscles|exportMappings|importMappings|async function|const .*muscle' static/app.js | head -55
          echo '=== BUILD INSTRUCTIONS ==='; cat README-FIRST.txt
          echo '=== GO ENVS ==='; ls -la; head -40 README.md
          echo '=== AUTOTAGGED INTERACTIONS ==='; grep -n -C 9 'AutoTagged' main.go
          echo '=== SAVE / LOAD ==='; sed -n '185,310p' main.go
          echo '=== USER POST / IMPORT ==='; sed -n '1470,1560p' main.go
          echo '=== MAPPING REPAIR ==='; grep -n -A 32 'func (a \*App) repairUnmapped' main.go
          echo '=== MODULE / VERSION / UI ==='; head -55 main.go; head -50 static/app.js
          

