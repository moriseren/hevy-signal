name: Restore original v3.7 release archives

on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-v37-assets.yml']

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original verified v3.7 archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 39527894781 -R moriseren/hevy-signal -n Hevy-Signal-v3.7-macOS -D dist
          test -f dist/Hevy-Signal-v3.7-SHA256.txt
          cd dist && sha256sum -c Hevy-Signal-v3.7-SHA256.txt
      - name: Restore release files for existing v3.7 users
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v3.7 -R moriseren/hevy-signal --clobber \
            dist/Hevy-Signal-v3.7-macOS-Apple-Silicon.zip \
            dist/Hevy-Signal-v3.7-macOS-Intel.zip \
            dist/Hevy-Signal-v3.7-source.zip \
            dist/Hevy-Signal-v3.7-SHA256.txt
